<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Menlo, DejaVu Sans Mono, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#141b26"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="72%">
      <stop offset="0"    stop-color="#e9d5ff"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.72" stop-color="#5b4bb7"/>
      <stop offset="1"    stop-color="#211a44"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#grid)"/>

  <!-- crystal ball: the oracle -->
  <circle cx="150" cy="140" r="140" fill="url(#glow)"/>
  <ellipse cx="150" cy="232" rx="62" ry="10" fill="#000" opacity="0.45"/>
  <path d="M100 222 h100 l-14 20 h-72 z" fill="#2c3545"/>
  <circle cx="150" cy="140" r="84" fill="url(#ball)"/>
  <ellipse cx="124" cy="112" rx="26" ry="18" fill="#fff" opacity="0.30" transform="rotate(-28 124 112)"/>
  <text x="150" y="160" font-size="58" fill="#0b0f14" opacity="0.65" text-anchor="middle">&#8704;</text>

  <!-- wordmark -->
  <text x="296" y="132" font-size="104" font-weight="bold" fill="#f3f6fa" letter-spacing="2">guru</text>
  <rect x="300" y="152" width="470" height="2" fill="#7dd3fc" opacity="0.55"/>
  <text x="300" y="188" font-size="25" fill="#9fb0c3">software engineering</text>
  <text x="300" y="222" font-size="25" fill="#9fb0c3">NC State &#183; Spring '27</text>

  <text x="300" y="266" font-size="20" fill="#7dd3fc">,/ &#9656; <tspan fill="#c084fc">failures are findings</tspan></text>
</svg>
